# Authenticated MQTT broker for Home Assistant and HASS.Agent.
# Credentials are never stored here: entrypoint.sh generates the password
# file from the stack's environment variables on every container start.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
